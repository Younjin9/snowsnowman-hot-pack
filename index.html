<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>눈사람 핫팩</title>
<style>
  :root {
    color-scheme: light;
    --cream: #f3ecdc;
    --cream-deep: #ded0b6;
    --ink: #24211d;
    --muted: #756f65;
    --vinyl: rgba(224, 241, 240, .12);
    --vinyl-edge: rgba(255, 255, 255, .76);
    --red: #c94f45;
    --red-deep: #9f342f;
    --metal: #a9aaa5;
    --shadow: rgba(77, 61, 37, .16);
  }

  * { box-sizing: border-box; }

  html,
  body {
    min-height: 100%;
    margin: 0;
  }

  body {
    min-height: 100dvh;
    overflow: hidden;
    color: var(--ink);
    background:
      radial-gradient(circle at 18% 14%, rgba(255, 255, 255, .72), transparent 26%),
      radial-gradient(circle at 82% 84%, rgba(190, 162, 111, .12), transparent 30%),
      linear-gradient(145deg, var(--cream), #eee3cf 60%, var(--cream-deep));
    font-family: ui-rounded, "SF Pro Rounded", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    user-select: none;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .16;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.15'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
  }

  button { font: inherit; }

  .stage {
    position: relative;
    width: 100%;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    place-items: center;
    gap: 8px;
    padding:
      max(20px, env(safe-area-inset-top))
      18px
      max(22px, env(safe-area-inset-bottom));
    isolation: isolate;
  }

  .eyebrow {
    margin: 0;
    color: rgba(73, 65, 54, .62);
    font-size: 10px;
    font-weight: 760;
    letter-spacing: .2em;
  }

  .pack-wrap {
    position: relative;
    width: min(74vw, 480px);
    height: min(70dvh, 700px);
    display: grid;
    place-items: center;
  }

  .pack-wrap::after {
    content: "";
    position: absolute;
    left: 14%;
    right: 14%;
    bottom: 2%;
    height: 5%;
    border-radius: 50%;
    background: var(--shadow);
    filter: blur(13px);
    transform: scaleX(.9);
    z-index: -1;
  }

  .pack {
    position: relative;
    height: 100%;
    max-width: 100%;
    aspect-ratio: .68;
    --freeze-x: 50%;
    --freeze-y: 60%;
    --frozen-opacity: 0;
    --disc-dx: 0px;
    --disc-dy: 0px;
    filter: drop-shadow(0 22px 22px rgba(79, 62, 38, .10));
    transform-origin: 50% 70%;
  }

  .pack.bump { animation: bump .36s cubic-bezier(.22, .8, .26, 1); }

  @keyframes bump {
    0%, 100% { transform: scale(1); }
    34% { transform: scale(.982, .968); }
    68% { transform: scale(1.012, 1.018); }
  }

  .body {
    position: absolute;
    inset: 0;
  }

  .head,
  .belly {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    overflow: hidden;
    border: 4px solid var(--vinyl-edge);
    background:
      linear-gradient(120deg, rgba(255,255,255,.36), transparent 24% 64%, rgba(171,203,204,.1)),
      var(--vinyl);
    box-shadow:
      inset 8px 8px 18px rgba(255,255,255,.42),
      inset -10px -14px 22px rgba(82,111,111,.07),
      0 0 0 2px rgba(150,151,143,.14);
    backdrop-filter: blur(3px) saturate(1.1);
    -webkit-backdrop-filter: blur(3px) saturate(1.1);
  }

  .head {
    top: 4.5%;
    width: 60%;
    height: 38%;
    border-radius: 48% 51% 46% 49% / 51% 49% 45% 47%;
    z-index: 5;
  }

  .belly {
    bottom: 3.5%;
    width: 79%;
    height: 61%;
    border-radius: 49% 51% 45% 47% / 46% 45% 52% 50%;
    z-index: 2;
  }

  .bridge {
    position: absolute;
    left: 50%;
    top: 34%;
    width: 46%;
    height: 18%;
    transform: translateX(-50%);
    z-index: 3;
    border-inline: 4px solid rgba(255, 255, 255, .7);
    background: linear-gradient(90deg, rgba(255,255,255,.12), rgba(210,228,229,.2), rgba(255,255,255,.12));
  }

  .seam {
    position: absolute;
    inset: 7px;
    border: 1px dashed rgba(128, 142, 139, .24);
    border-radius: inherit;
    z-index: 8;
    pointer-events: none;
  }

  .liquid-glow {
    position: absolute;
    inset: 14% 12% 10%;
    border-radius: 48%;
    background:
      radial-gradient(circle at 28% 22%, rgba(255,255,255,.26), transparent 20%),
      linear-gradient(145deg, rgba(217,236,235,.04), rgba(183,213,215,.08));
    filter: blur(3px);
    z-index: 1;
    pointer-events: none;
  }

  .vinyl-shine {
    position: absolute;
    left: 17%;
    top: 12%;
    width: 13%;
    height: 54%;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.54), rgba(255,255,255,.02));
    filter: blur(3px);
    transform: rotate(10deg);
    z-index: 9;
    pointer-events: none;
  }

  .face {
    position: absolute;
    inset: 0;
    z-index: 14;
    pointer-events: none;
  }

  .eye {
    position: absolute;
    top: 40%;
    width: 17px;
    height: 18px;
    border-radius: 49%;
    background: #2b2926;
    box-shadow: inset 4px 3px 0 rgba(255,255,255,.16), 0 2px 2px rgba(67,52,34,.12);
  }

  .eye.left { left: 30%; transform: rotate(5deg); }
  .eye.right { right: 30%; transform: rotate(-4deg); }

  .nose {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 38px;
    height: 15px;
    transform: translateX(-2px) rotate(7deg);
    transform-origin: left center;
    clip-path: polygon(0 5%, 100% 50%, 0 95%);
    background: linear-gradient(180deg, #f5a13f, #dd741d);
    filter: drop-shadow(0 2px 1px rgba(104, 58, 16, .18));
  }

  .mouth {
    position: absolute;
    top: 62%;
    left: 50%;
    width: 51px;
    height: 21px;
    border-bottom: 4px solid #2b2926;
    border-radius: 0 0 50px 50px;
    transform: translateX(-50%);
  }

  .cheek {
    position: absolute;
    top: 59%;
    width: 22px;
    height: 10px;
    border-radius: 50%;
    background: rgba(218, 109, 95, .13);
    filter: blur(1px);
  }

  .cheek.left { left: 20%; }
  .cheek.right { right: 20%; }

  .freeze-fill {
    position: absolute;
    left: var(--origin-x);
    top: var(--origin-y);
    width: 220%;
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(250,253,252,.99) 0 38%, rgba(247,251,250,.94) 55%, rgba(235,245,244,.46) 70%, transparent 77%);
    opacity: 0;
    transform: translate(-50%, -50%) scale(.02);
    transform-origin: center;
    pointer-events: none;
    z-index: 2;
  }

  .belly-freeze {
    --origin-x: var(--freeze-x);
    --origin-y: var(--freeze-y);
  }

  .head-freeze {
    --origin-x: 50%;
    --origin-y: 108%;
    width: 245%;
  }

  .pack.crystallizing .belly-freeze {
    animation: freezeBloom 1.78s cubic-bezier(.16,.76,.24,1) forwards;
  }

  .pack.crystallizing .head-freeze {
    animation: freezeBloom 1.58s .62s cubic-bezier(.16,.76,.24,1) forwards;
  }

  .pack.solid { --frozen-opacity: .96; }

  .pack.solid .freeze-fill {
    opacity: var(--frozen-opacity);
    transform: translate(-50%, -50%) scale(1.12);
  }

  .pack.melting .freeze-fill {
    animation: freezeMelt var(--melt-time) linear forwards;
  }

  @keyframes freezeBloom {
    0% { opacity: .12; transform: translate(-50%, -50%) scale(.02); }
    38% { opacity: .5; }
    76% { opacity: .86; }
    100% { opacity: .96; transform: translate(-50%, -50%) scale(1.12); }
  }

  @keyframes freezeMelt {
    0% { opacity: .96; transform: translate(-50%, -50%) scale(1.12); }
    72% { opacity: .36; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(.82); }
  }

  .hat-crown {
    position: absolute;
    left: 50%;
    top: .8%;
    width: 45%;
    height: 14.5%;
    transform: translateX(-50%) rotate(1.5deg);
    border-radius: 52% 52% 22% 22% / 58% 58% 35% 35%;
    background: linear-gradient(145deg, #dc675b, var(--red) 54%, var(--red-deep));
    box-shadow: inset 0 6px 0 rgba(255,255,255,.2), 0 5px 9px rgba(105,49,42,.13);
    z-index: 4;
  }

  .hat-pom {
    position: absolute;
    width: 28%;
    aspect-ratio: 1;
    left: 60%;
    top: -34%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e4776c, var(--red) 62%, var(--red-deep));
    box-shadow: 0 4px 6px rgba(95,42,36,.14);
  }

  .hat-brim {
    position: absolute;
    left: 50%;
    top: 10.5%;
    width: 53%;
    height: 6.7%;
    transform: translateX(-50%) rotate(1deg);
    border-radius: 50% 50% 45% 45% / 58% 58% 42% 42%;
    background: linear-gradient(180deg, #c94b43, #a73731);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.15), 0 4px 5px rgba(89,39,34,.16);
    z-index: 20;
    pointer-events: none;
  }

  .hat-fold {
    position: absolute;
    inset: 34% 10% auto;
    height: 1px;
    border-radius: 999px;
    background: rgba(112, 36, 32, .2);
    pointer-events: none;
  }

  .scarf {
    position: absolute;
    left: 22%;
    right: 21%;
    top: 35.7%;
    height: 8.4%;
    border-radius: 14px;
    background: linear-gradient(180deg, #d35a50, var(--red) 54%, #b33c35);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.18), 0 6px 7px rgba(98,43,37,.14);
    transform: rotate(1deg);
    z-index: 21;
  }

  .scarf-tail {
    position: absolute;
    right: 7%;
    top: 58%;
    width: 20%;
    height: 210%;
    border-radius: 0 0 9px 9px;
    background: linear-gradient(90deg, #b43e37, #c94f45 55%, #a83630);
    transform: rotate(-7deg);
    box-shadow: inset 3px 0 0 rgba(255,255,255,.1), 3px 5px 6px rgba(87,40,35,.12);
  }

  .scarf-fringe {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -9px;
    height: 12px;
    background: repeating-linear-gradient(90deg, #a93631 0 3px, transparent 3px 6px);
    pointer-events: none;
  }

  .button-dot {
    position: absolute;
    left: 50%;
    width: 19px;
    height: 20px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #514d46, #242321 58%, #151513);
    box-shadow: 0 2px 3px rgba(61,47,30,.2);
    z-index: 13;
    pointer-events: none;
  }

  .button-dot.one { top: 52%; }
  .button-dot.two { top: 60.5%; }

  .disc {
    position: absolute;
    left: 50%;
    top: 72%;
    width: 86px;
    height: 86px;
    transform: translate(-50%, -50%) translate(var(--disc-dx), var(--disc-dy));
    border: 4px solid #888a85;
    border-radius: 50%;
    cursor: pointer;
    z-index: 25;
    background:
      radial-gradient(circle at 34% 29%, rgba(255,255,255,.92) 0 4%, transparent 5%),
      radial-gradient(circle at 50% 48%, transparent 0 42%, rgba(77,78,74,.24) 43% 46%, transparent 47%),
      conic-gradient(from 12deg, #c8c9c5, #8f918d, #d1d2ce, #92938f, #c4c5c0, #8d8f8a, #c8c9c5);
    box-shadow:
      inset 0 0 0 4px rgba(238,239,235,.48),
      inset 0 -7px 12px rgba(73,74,70,.2),
      0 4px 7px rgba(60,52,40,.25);
    transition: transform .12s ease, filter .2s ease, box-shadow .2s ease;
    touch-action: none;
    will-change: transform;
  }

  .disc::before {
    content: "";
    position: absolute;
    inset: 13%;
    border: 1px solid rgba(73,74,70,.34);
    border-radius: 50%;
    background: radial-gradient(ellipse at 42% 37%, rgba(255,255,255,.48), transparent 45%);
  }

  .disc:hover { filter: brightness(1.06); }

  .disc:active {
    transform: translate(-50%, -50%) translate(var(--disc-dx), var(--disc-dy)) scale(.9);
    box-shadow: inset 0 0 0 4px rgba(238,239,235,.3), inset 0 5px 12px rgba(61,62,59,.3), 0 1px 2px rgba(60,52,40,.16);
  }

  .disc:focus-visible,
  .melt-btn:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 5px;
  }

  .crystal-layer {
    position: absolute;
    inset: 0;
    z-index: 7;
    pointer-events: none;
    opacity: 0;
    transition: opacity .16s linear;
  }

  .crystal {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    opacity: 0;
    background: rgba(248, 253, 252, .96);
    box-shadow: 0 0 7px rgba(255,255,255,.76);
    transform: translate(-50%, -50%) scale(.12) rotate(var(--r));
  }

  .crystal::before,
  .crystal::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--branch, 30px);
    height: 2px;
    border-radius: 999px;
    background: rgba(247, 253, 252, .84);
    transform-origin: center;
  }

  .crystal::before { transform: translate(-50%, -50%) rotate(35deg); }
  .crystal::after { transform: translate(-50%, -50%) rotate(-35deg); }

  .fog {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    filter: blur(9px);
    background:
      radial-gradient(circle at 50% 73%, rgba(250,253,251,.98), transparent 17%),
      radial-gradient(circle at 37% 54%, rgba(244,250,249,.86), transparent 28%),
      radial-gradient(circle at 66% 36%, rgba(249,252,250,.88), transparent 31%);
  }

  .pack.crystallizing .crystal-layer,
  .pack.solid .crystal-layer { opacity: 1; }

  .pack.crystallizing .crystal {
    animation: growCrystal .8s cubic-bezier(.2,.7,.2,1) forwards;
    animation-delay: var(--d);
  }

  .pack.crystallizing .fog { animation: fogIn 2.15s ease forwards; }
  .pack.solid .fog { opacity: .88; filter: blur(5px); }
  .pack.crystallizing { animation: microShake .12s linear 4; }

  @keyframes growCrystal {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.12) rotate(var(--r)); }
    32% { opacity: 1; }
    100% { opacity: var(--o); transform: translate(-50%, -50%) scale(var(--s)) rotate(var(--r)); }
  }

  @keyframes fogIn {
    from { opacity: 0; filter: blur(11px); }
    to { opacity: .88; filter: blur(5px); }
  }

  @keyframes microShake {
    0%, 100% { transform: translate(0); }
    25% { transform: translate(-1px, 1px); }
    50% { transform: translate(1px, -1px); }
    75% { transform: translate(1px, 1px); }
  }

  .pack.melting .fog { animation: fogOut var(--melt-time) linear forwards; }
  .pack.melting .crystal-layer { animation: crystalOut var(--melt-time) linear forwards; }

  @keyframes fogOut { from { opacity: .88; } to { opacity: 0; } }
  @keyframes crystalOut { 0% { opacity: 1; } 75% { opacity: .28; } 100% { opacity: 0; } }

  .status {
    min-height: 22px;
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    font-weight: 650;
    text-align: center;
  }

  .countdown {
    min-height: 25px;
    margin: -4px 0 0;
    font-size: 18px;
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    opacity: 0;
    transition: opacity .2s ease;
  }

  .countdown.show { opacity: 1; }

  .melt-btn {
    min-width: 128px;
    min-height: 46px;
    margin-top: 1px;
    padding: 12px 24px;
    border: 1px solid rgba(36,33,29,.9);
    border-radius: 999px;
    color: #f8f5ee;
    background: var(--ink);
    box-shadow: 0 8px 18px rgba(60,46,29,.18), inset 0 1px 0 rgba(255,255,255,.12);
    cursor: pointer;
    font-size: 15px;
    font-weight: 760;
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: opacity .22s ease, transform .22s ease, background .2s ease;
  }

  .melt-btn.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .melt-btn:hover { background: #3b3731; }
  .melt-btn:active { transform: scale(.97); }
  .melt-btn:disabled { cursor: wait; opacity: .7; }

  @media (max-width: 650px) {
    .stage { padding-inline: 12px; gap: 5px; }
    .pack-wrap { width: min(88vw, 440px); height: min(67dvh, 620px); }
    .disc { width: 72px; height: 72px; }
    .eye { width: 15px; height: 16px; }
    .status { font-size: 13px; }
  }

  @media (max-height: 700px) {
    .stage { padding-block: 10px; }
    .pack-wrap { width: min(74vw, 380px); height: min(62dvh, 540px); }
    .eyebrow { display: none; }
    .status { min-height: 18px; }
    .melt-btn { min-height: 42px; padding-block: 9px; }
  }

  @media (max-height: 480px) and (orientation: landscape) {
    .stage {
      grid-template-columns: minmax(0, 1fr) 190px;
      grid-template-rows: 1fr auto auto;
      padding-inline: max(18px, env(safe-area-inset-left)) max(18px, env(safe-area-inset-right));
    }
    .pack-wrap { grid-row: 1 / 4; width: min(56vw, 330px); height: min(92dvh, 430px); }
    .status, .countdown, .melt-btn { grid-column: 2; }
    .status { align-self: end; }
    .melt-btn { align-self: start; }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --cream: #26231f;
      --cream-deep: #171715;
      --ink: #f2ede4;
      --muted: #c1b7a8;
      --vinyl: rgba(190, 211, 209, .22);
      --vinyl-edge: rgba(236, 246, 243, .52);
      --metal: #aeb0ac;
      --shadow: rgba(8, 7, 6, .42);
    }
    body {
      background:
        radial-gradient(circle at 18% 14%, rgba(106, 98, 84, .22), transparent 28%),
        radial-gradient(circle at 82% 84%, rgba(148, 72, 60, .1), transparent 30%),
        linear-gradient(145deg, var(--cream), #211e1a 60%, var(--cream-deep));
    }
    body::before { opacity: .08; mix-blend-mode: screen; }
    .melt-btn { color: #24211d; background: #f2ede4; border-color: #f2ede4; }
    .melt-btn:hover { background: #ddd5c8; }
    .disc:focus-visible, .melt-btn:focus-visible { outline-color: #f2ede4; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
    }
  }

  @media (prefers-reduced-transparency: reduce) {
    .head, .belly {
      background: rgba(232, 239, 236, .92);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
  }
</style>
</head>
<body>
<main class="stage">
  <p class="eyebrow">REUSABLE POCKET WARMER</p>
  <section class="pack-wrap" aria-label="눈사람 모양 재사용 핫팩">
    <div class="pack" id="pack" data-state="ready">
      <div class="body">
        <div class="bridge"></div>
        <div class="hat-crown"><span class="hat-pom"></span></div>
        <div class="belly">
          <span class="freeze-fill belly-freeze"></span>
          <span class="seam"></span>
          <span class="liquid-glow"></span>
          <span class="vinyl-shine"></span>
          <div class="fog"></div>
          <div class="crystal-layer belly-crystals"></div>
        </div>
        <div class="head">
          <span class="freeze-fill head-freeze"></span>
          <span class="seam"></span>
          <span class="liquid-glow"></span>
          <span class="vinyl-shine"></span>
          <div class="fog"></div>
          <div class="crystal-layer head-crystals"></div>
          <div class="face">
            <span class="eye left"></span>
            <span class="eye right"></span>
            <span class="nose"></span>
            <span class="mouth"></span>
            <span class="cheek left"></span>
            <span class="cheek right"></span>
          </div>
        </div>
        <div class="hat-brim"><span class="hat-fold"></span></div>
        <div class="scarf"><span class="scarf-tail"><span class="scarf-fringe"></span></span></div>
        <span class="button-dot one"></span>
        <span class="button-dot two"></span>
        <button class="disc" id="disc" aria-label="핫팩 똑딱이 누르기"></button>
      </div>
    </div>
  </section>
  <p class="status" id="status" aria-live="polite">금속 똑딱이를 눌러 따뜻하게 해보세요</p>
  <div class="countdown" id="countdown" aria-live="polite"></div>
  <button class="melt-btn" id="meltBtn">녹이기</button>
</main>

<script>
(() => {
  const pack = document.getElementById('pack');
  const disc = document.getElementById('disc');
  const meltBtn = document.getElementById('meltBtn');
  const countdown = document.getElementById('countdown');
  const status = document.getElementById('status');
  const belly = document.querySelector('.belly');

  let state = 'ready';
  let meltArmed = false;
  let meltTimer = null;
  let stateTimer = null;
  let drag = null;
  let discPosition = { x: 50, y: 72 };

  function setState(nextState, message) {
    state = nextState;
    pack.dataset.state = nextState;
    status.textContent = message;
  }

  function clampDiscPosition(x, y) {
    const dx = (x - 50) / 20;
    const dy = (y - 71) / 13.5;
    const distance = Math.hypot(dx, dy);
    if (distance <= 1) return { x, y };
    return {
      x: 50 + (dx / distance) * 20,
      y: 71 + (dy / distance) * 13.5,
    };
  }

  function setDiscPosition(x, y) {
    const next = clampDiscPosition(x, y);
    const packRect = pack.getBoundingClientRect();
    const bellyRect = belly.getBoundingClientRect();
    const discX = packRect.left + packRect.width * next.x / 100;
    const discY = packRect.top + packRect.height * next.y / 100;
    const offsetX = packRect.width * (next.x - 50) / 100;
    const offsetY = packRect.height * (next.y - 72) / 100;
    const freezeX = (discX - bellyRect.left) / bellyRect.width * 100;
    const freezeY = (discY - bellyRect.top) / bellyRect.height * 100;

    discPosition = next;
    pack.style.setProperty('--disc-dx', `${offsetX}px`);
    pack.style.setProperty('--disc-dy', `${offsetY}px`);
    pack.style.setProperty('--freeze-x', `${freezeX}%`);
    pack.style.setProperty('--freeze-y', `${freezeY}%`);
  }

  function beginDiscDrag(event) {
    if (state !== 'ready') return;
    drag = {
      pointerId: event.pointerId,
      startX: event.clientX,
      startY: event.clientY,
    };
    disc.setPointerCapture(event.pointerId);
  }

  function moveDisc(event) {
    if (!drag || drag.pointerId !== event.pointerId || state !== 'ready') return;
    const travel = Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY);
    if (travel < 6) return;
    const packRect = pack.getBoundingClientRect();
    const x = (event.clientX - packRect.left) / packRect.width * 100;
    const y = (event.clientY - packRect.top) / packRect.height * 100;
    setDiscPosition(x, y);
  }

  function endDiscDrag(event) {
    if (!drag || drag.pointerId !== event.pointerId) return;
    const travel = Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY);
    if (disc.hasPointerCapture(event.pointerId)) disc.releasePointerCapture(event.pointerId);
    drag = null;
    if (travel < 6) startCrystallization();
    else setState('ready', '똑딱이를 눌러 결정화를 시작하세요');
  }

  function seedCrystals(container, count, startX = 50, startY = 70) {
    container.replaceChildren();
    for (let i = 0; i < count; i += 1) {
      const crystal = document.createElement('span');
      crystal.className = 'crystal';
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.pow(Math.random(), .58) * 58;
      const x = Math.max(6, Math.min(94, startX + Math.cos(angle) * radius));
      const y = Math.max(5, Math.min(95, startY + Math.sin(angle) * radius));
      const distance = Math.hypot(x - startX, y - startY);

      crystal.style.left = `${x}%`;
      crystal.style.top = `${y}%`;
      crystal.style.setProperty('--d', `${distance * .018 + Math.random() * .22}s`);
      crystal.style.setProperty('--s', (.45 + Math.random() * 1.15).toFixed(2));
      crystal.style.setProperty('--r', `${Math.round(Math.random() * 180)}deg`);
      crystal.style.setProperty('--o', (.7 + Math.random() * .28).toFixed(2));
      crystal.style.setProperty('--branch', `${24 + Math.round(Math.random() * 16)}px`);
      container.appendChild(crystal);
    }
  }

  function prepareCrystals() {
    seedCrystals(document.querySelector('.belly-crystals'), 108, 50, 70);
    seedCrystals(document.querySelector('.head-crystals'), 68, 50, 90);
  }

  function clickSound() {
    try {
      const AudioEngine = window.AudioContext || window.webkitAudioContext;
      if (!AudioEngine) return;
      const context = new AudioEngine();
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = 'square';
      oscillator.frequency.setValueAtTime(165, context.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(85, context.currentTime + .045);
      gain.gain.setValueAtTime(.1, context.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, context.currentTime + .06);
      oscillator.connect(gain).connect(context.destination);
      oscillator.start();
      oscillator.stop(context.currentTime + .065);
      oscillator.addEventListener('ended', () => context.close(), { once: true });
    } catch {}
  }

  function startCrystallization() {
    if (state !== 'ready') return;
    setDiscPosition(discPosition.x, discPosition.y);
    clearTimeout(stateTimer);
    meltArmed = false;
    countdown.classList.remove('show');
    countdown.textContent = '';
    meltBtn.classList.remove('show');
    setState('crystallizing', '결정이 퍼지고 있어요');
    prepareCrystals();
    clickSound();
    pack.classList.remove('solid', 'melting');
    void pack.offsetWidth;
    pack.classList.add('bump', 'crystallizing');
    setTimeout(() => pack.classList.remove('bump'), 400);
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    stateTimer = setTimeout(() => {
      pack.classList.remove('crystallizing');
      pack.classList.add('solid');
      setState('solid', '따뜻해졌어요. 녹이면 다시 사용할 수 있어요');
      meltBtn.classList.add('show');
    }, reducedMotion ? 40 : 2350);
  }

  function armMelt() {
    if (state !== 'solid') return;
    meltArmed = true;
    setState('armed', '한 번 더 누르면 녹이기 시작해요');
    meltBtn.textContent = '진짜 녹이기';
    pack.classList.add('bump');
    setTimeout(() => pack.classList.remove('bump'), 350);
  }

  function startMelting(seconds) {
    if (state !== 'armed') return;
    let left = seconds;
    clearInterval(meltTimer);
    clearTimeout(stateTimer);
    setState('melting', '결정이 천천히 녹고 있어요');
    meltBtn.disabled = true;
    meltBtn.textContent = '녹는 중';
    countdown.textContent = `${left}초`;
    countdown.classList.add('show');
    pack.style.setProperty('--melt-time', `${seconds}s`);
    pack.classList.remove('solid');
    pack.classList.add('melting');

    meltTimer = setInterval(() => {
      left -= 1;
      if (left > 0) countdown.textContent = `${left}초`;
      else clearInterval(meltTimer);
    }, 1000);

    stateTimer = setTimeout(resetPack, seconds * 1000);
  }

  function resetPack() {
    clearInterval(meltTimer);
    clearTimeout(stateTimer);
    meltTimer = null;
    stateTimer = null;
    meltArmed = false;
    pack.classList.remove('crystallizing', 'solid', 'melting', 'bump');
    document.querySelectorAll('.crystal-layer').forEach((layer) => layer.replaceChildren());
    countdown.classList.remove('show');
    countdown.textContent = '';
    meltBtn.classList.remove('show');
    meltBtn.disabled = false;
    meltBtn.textContent = '녹이기';
    setState('ready', '금속 똑딱이를 눌러 따뜻하게 해보세요');
  }

  disc.addEventListener('pointerdown', beginDiscDrag);
  disc.addEventListener('pointermove', moveDisc);
  disc.addEventListener('pointerup', endDiscDrag);
  disc.addEventListener('pointercancel', () => { drag = null; });
  disc.addEventListener('click', (event) => {
    if (event.detail === 0) startCrystallization();
  });

  meltBtn.addEventListener('click', () => {
    if (state === 'solid' && !meltArmed) {
      armMelt();
      return;
    }
    if (state === 'armed') {
      const seconds = Math.floor(Math.random() * 7) + 4;
      startMelting(seconds);
    }
  });
})();
</script>
</body>
</html>
